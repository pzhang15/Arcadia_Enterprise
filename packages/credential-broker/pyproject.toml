[project]
name = "arcadia-credential-broker"
version = "0.1.0"
description = "Host-side credential broker for secure, short-lived token injection into agent sandboxes via virtio-vsock."
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [
    { name = "Pat Zhang" },
]

dependencies = [
    "pydantic>=2.9.0",
    "cryptography>=44.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["credential_broker*"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
]
