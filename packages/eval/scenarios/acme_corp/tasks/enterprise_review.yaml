id: enterprise_review
description: Cross-department review covering IT tickets, onboarding, finance, incidents, customer health, and compliance status.
prompt: |
  Perform a comprehensive enterprise review across all departments:

  (1) IT Helpdesk: Read all open tickets in /tickets/queues/it-helpdesk/open/.
      Classify by priority, identify duplicates, and flag any needing escalation.

  (2) HR/Onboarding: Check the New Hire Tracker in /sheets/owned/ for any
      onboarding in progress. Cross-reference with IT tickets for that hire.

  (3) Finance: Review pending expense reports in /finance/expenses/pending/
      and the Q2 budget in /finance/budgets/. Flag any policy violations.

  (4) Engineering: Check /pagerduty/incidents/triggered/ for active incidents.
      Cross-reference with /github/repos/acme-corp/platform-api/deployments/
      and /datadog/logs/platform-api/ for root cause.

  (5) Customer Support: Review customer escalations in /customers/escalations/
      and account health in /customers/accounts/. Link to engineering incidents
      if applicable.

  (6) Compliance: Check /compliance/audits/ for upcoming audit deadlines and
      /compliance/policies/ for acknowledgment gaps.

  Write an executive summary to /enterprise_review.md with one section per
  department. Be specific — cite ticket IDs, account names, amounts, and dates.

oracles:
  files_must_exist:
    - /enterprise_review.md
  must_contain_in_file:
    /enterprise_review.md:
      - INC-1001
      - Alex Rivera
      - INC-5521
      - GlobalTech
      - SOC2
  ops_must_touch_prefix:
    - /tickets/queues/it-helpdesk/open/
    - /sheets/owned/
    - /finance/expenses/pending/
    - /pagerduty/incidents/triggered/
    - /customers/escalations/
    - /compliance/audits/
  max_enoent: 3

trajectory_budget:
  max_turns: 40
  max_commands: 120
  max_wallclock_s: 360
  max_tokens: 300000

judge:
  model: gpt-5
  rubric:
    completeness:
      weight: 0.35
      criteria: |
        All six departments are covered. Each section contains specific
        findings with IDs, names, and data points from the source files.
    cross_referencing:
      weight: 0.30
      criteria: |
        Cross-department connections are identified: Alex's onboarding
        tickets linked to HR tracker, customer escalation linked to
        engineering incident, compliance audit linked to IT policies.
    accuracy:
      weight: 0.20
      criteria: |
        All cited ticket IDs, account names, amounts, and dates match
        the source data. No fabricated information.
    actionability:
      weight: 0.15
      criteria: |
        Each section ends with concrete next steps. An executive could
        act on this document without additional research.
