[project]
name = "arcadia-catalog-proxy"
version = "0.1.0"
description = "Translation layer between the Agent Workspace VFS and enterprise data sources (Iceberg, Snowflake, MCP, etc.)."
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [
    { name = "Pat Zhang" },
]

dependencies = [
    "mirage-ai",
    "httpx>=0.28.1",
    "pydantic>=2.9.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["catalog_proxy*"]

[tool.uv.sources]
mirage-ai = { path = "../../vendor/mirage/python", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
]
