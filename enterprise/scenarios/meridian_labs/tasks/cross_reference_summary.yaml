id: cross_reference_summary
description: Summarize all current incidents with their linked tickets, Slack discussions, and deployment correlation.
prompt: |
  Produce a summary of all current (non-resolved) incidents across the
  Meridian Labs infrastructure.

  (1) List PagerDuty incidents from /pagerduty/incidents/triggered/ and
      /pagerduty/incidents/acknowledged/.
  (2) For each incident, find the corresponding Jira ticket in
      /tickets/queues/ops/open/.
  (3) Check /slack/channels/incidents__C001/ for discussion about each
      incident.
  (4) Check /github/repos/meridian-labs/payments-api/deployments/ for any
      recent deployments that correlate with each incident.

  Write a unified summary to /incident_summary.md with a section per
  incident containing:
    - Incident ID, service, severity, status, assignee
    - Linked Jira ticket ID and its current status
    - Key Slack discussion points
    - Any correlated deployments
    - Current blocker or next action

oracles:
  files_must_exist:
    - /incident_summary.md
  must_contain_in_file:
    /incident_summary.md:
      - INC-5521
      - INC-5520
      - OPS-1247
      - OPS-1245
      - payments-api
      - merchant-dashboard
      - Bob Martinez
      - Iris Petrova
  must_not_contain_in_file:
    /incident_summary.md:
      - PAY-880
  ops_must_touch_prefix:
    - /pagerduty/incidents/triggered/
    - /pagerduty/incidents/acknowledged/
    - /tickets/queues/ops/open/
    - /slack/channels/incidents__C001
  max_enoent: 2

trajectory_budget:
  max_turns: 25
  max_commands: 60
  max_wallclock_s: 180
  max_tokens: 150000

judge:
  model: gpt-5
  rubric:
    completeness:
      weight: 0.40
      criteria: |
        Both active incidents are covered (INC-5521 on payments-api and
        INC-5520 on merchant-dashboard). Each has its linked Jira ticket
        identified (OPS-1247 and OPS-1245 respectively). Missing either
        incident is a significant deduction.
    cross_referencing:
      weight: 0.35
      criteria: |
        The summary connects data across services: PagerDuty incident ->
        Jira ticket -> Slack discussion. Deployment d4e5f6 should be linked
        to INC-5521. Connection pool exhaustion from the commit should be
        surfaced for the payments-api incident.
    accuracy:
      weight: 0.25
      criteria: |
        Assignees, statuses, severity levels, and timelines match the
        source data. No invented or confused details. Bob Martinez owns
        INC-5521/OPS-1247; Iris Petrova owns INC-5520/OPS-1245.
