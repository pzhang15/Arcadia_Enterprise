services:
  mock-services:
    build:
      context: ../..
      dockerfile: enterprise/docker/Dockerfile
    command: uv run python docker/mock_server.py
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  mirage-api:
    build:
      context: ../..
      dockerfile: enterprise/docker/Dockerfile
    command: >
      uv run python -m uvicorn mirage.server.app:build_app
      --factory --host 0.0.0.0 --port 8080
    ports:
      - "8080:8080"
    depends_on:
      mock-services:
        condition: service_healthy
    environment:
      - MOCK_SERVICES_URL=http://mock-services:3000

  mirage-mcp:
    build:
      context: ../..
      dockerfile: enterprise/docker/Dockerfile
    command: >
      uv run mirage-mcp
      --scenario meridian_labs
      --transport streamable-http
    ports:
      - "8081:8000"
    depends_on:
      mock-services:
        condition: service_healthy
    environment:
      - MOCK_SERVICES_URL=http://mock-services:3000
