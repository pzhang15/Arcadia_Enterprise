services:
  trace-generator:
    build:
      context: ../..
      dockerfile: docker/trace-demo/Dockerfile
    volumes:
      - trace-data:/app/data

  observability:
    build:
      context: ../../frontends/observability
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    environment:
      - TRACES_DB=/app/data/traces.db
    volumes:
      - trace-data:/app/data:ro
    depends_on:
      trace-generator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8082/api/health"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  trace-data:
