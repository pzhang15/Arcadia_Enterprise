services:
  trace-generator:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    working_dir: /app
    command: uv run python /app/docker/generate_traces.py
    volumes:
      - trace-data:/app/data

  arcadia-platform:
    build:
      context: ..
      dockerfile: frontends/platform/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DISK_ROOT=/app/fixture
      - TRACES_DB=/app/data/traces.db
      - RESULTS_DIR=/app/results
    env_file:
      - ../.env
    volumes:
      - ../packages/eval/scenarios/northhill_corp/fixture/disk:/app/fixture:ro
      - ../packages/eval/results:/app/results:ro
      - trace-data:/app/data:ro
    depends_on:
      trace-generator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/api/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  mock-services:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    working_dir: /app/packages/eval
    command: uv run python /app/docker/mock_server.py
    ports:
      - "3000:3000"
    depends_on:
      arcadia-platform:
        condition: service_healthy
    environment:
      - RELAY_URL=http://arcadia-platform:8080
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  mirage:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    working_dir: /app/packages/eval
    command: >
      uv run mirage-mcp
      --scenario northhill_corp
      --transport streamable-http
      --host 0.0.0.0
    ports:
      - "8081:8000"
    depends_on:
      mock-services:
        condition: service_healthy
    environment:
      - MOCK_SERVICES_URL=http://mock-services:3000
      - RELAY_URL=http://arcadia-platform:8080

volumes:
  trace-data:
