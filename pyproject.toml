[project]
name = "arcadia"
version = "0.1.0"
description = "The governed data access layer for autonomous agents."
requires-python = ">=3.12"
dependencies = [
    "mirage-ai",
    "arcadia-eval",
    "arcadia-catalog-proxy",
    "arcadia-credential-broker",
    "arcadia-lineage",
    "arcadia-policy-engine",
    "arcadia-workspace-vfs",
    "arcadia-store",
]

[tool.uv.workspace]
members = ["packages/*"]
exclude = ["packages/ds-testing"]

[tool.uv.sources]
mirage-ai = { path = "vendor/mirage/python", editable = true }
arcadia-eval = { workspace = true }
arcadia-catalog-proxy = { workspace = true }
arcadia-credential-broker = { workspace = true }
arcadia-lineage = { workspace = true }
arcadia-policy-engine = { workspace = true }
arcadia-workspace-vfs = { workspace = true }
arcadia-store = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
testpaths = ["packages/eval/tests", "packages/eval/scenarios", "frontends/platform/tests", "packages/store/tests"]
addopts = "-q --import-mode=importlib"
asyncio_mode = "auto"
